<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Edvin Rahnama | Data Scientist &amp; Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Edvin Rahnama — Data Scientist &amp; Software Engineer in Kiel, Germany. Machine Learning, MLOps, Python, AWS and Docker."
    />
    <meta name="author" content="Edvin Rahnama" />
    <link rel="canonical" href="https://edvin-rahnama.space/" />

    <!-- Colour scheme: lets the browser paint native UI (scrollbars, form controls) correctly -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1220" media="(prefers-color-scheme: dark)" />

    <!-- Fonts: preconnect + stylesheet link. Loading these via @import inside index.css
         silently failed — PostCSS drops any @import that follows the @tailwind directives,
         so the site shipped with system fallbacks instead of Outfit / JetBrains Mono. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    />

    <meta property="og:title" content="Edvin Rahnama | Data Scientist &amp; Software Engineer" />
    <meta
      property="og:description"
      content="Machine Learning, MLOps and data engineering. Python, AWS, Docker. Based in Kiel, Germany."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://edvin-rahnama.space/" />
    <meta property="og:image" content="https://edvin-rahnama.space/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Edvin Rahnama — Data Scientist &amp; Software Engineer" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Edvin Rahnama | Data Scientist &amp; Software Engineer" />
    <meta
      name="twitter:description"
      content="Machine Learning, MLOps and data engineering. Python, AWS, Docker. Based in Kiel, Germany."
    />
    <meta name="twitter:image" content="https://edvin-rahnama.space/og-image.png" />

    <!-- Structured data: lets search engines render this as a person with a
         job title, employer and verified profiles rather than an untyped page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Edvin Rahnama",
        "jobTitle": "Data Scientist & Software Engineer",
        "url": "https://edvin-rahnama.space/",
        "email": "mailto:amirhossein.rahnama@outlook.com",
        "image": "https://edvin-rahnama.space/og-image.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kiel",
          "addressCountry": "DE"
        },
        "alumniOf": [
          {
            "@type": "CollegeOrUniversity",
            "name": "Kiel University of Applied Sciences"
          },
          {
            "@type": "CollegeOrUniversity",
            "name": "Eastern Mediterranean University"
          }
        ],
        "worksFor": { "@type": "Organization", "name": "t2consult" },
        "knowsLanguage": ["en", "de", "tr", "fa"],
        "knowsAbout": [
          "Machine Learning",
          "MLOps",
          "Physics-Informed Neural Networks",
          "Data Engineering",
          "Python",
          "AWS",
          "Docker",
          "Kubernetes"
        ],
        "sameAs": [
          "https://www.linkedin.com/in/edvin-rahnama-908b1b179/",
          "https://github.com/amirhossein-rahnama"
        ]
      }
    </script>

    <script>
      (function () {
        var redirect = sessionStorage.getItem('redirect');
        sessionStorage.removeItem('redirect');
        if (redirect && redirect != location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
